<article class="card" data-wrh-module="esp8266-socket" data-port="{port}" data-module-id="{id}">
    <header class="card-head">
        <span class="card-icon"><svg class="icon" aria-hidden="true"><use href="#i-plug"/></svg></span>
        <h2 class="card-title">{name}</h2>
        <button type="button" class="icon-btn" data-action="refresh" aria-label="Odśwież">
            <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
    </header>
    <span class="badge badge--lg" data-role="badge"></span>
    <label class="switch-row">
        <span>Bez limitu czasu</span>
        <input type="checkbox" class="switch" data-role="unlimited" checked>
    </label>
    <div class="field" data-role="time-field">
        <label class="field-label" for="{input_text}">Wyłącz automatycznie po</label>
        <div class="input-row">
            <span class="input-suffix">
                <input class="input" id="{input_text}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5"
                       autocomplete="off" value="600" data-role="time" disabled>
                <span class="input-suffix-text">sek.</span>
            </span>
            <span class="hint" data-role="time-hint"></span>
        </div>
    </div>
    <div class="card-msg" data-role="error" hidden></div>
    <div class="actions">
        <button type="button" class="btn btn-primary" data-command="ON"><svg class="icon" aria-hidden="true"><use href="#i-power"/></svg><span>Włącz</span></button>
        <button type="button" class="btn btn-secondary" data-command="OFF">Wyłącz</button>
    </div>
</article>
