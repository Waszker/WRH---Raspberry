<section class="module module--group" data-wrh-module="rango-iryga" data-port="{port}" data-module-id="{id}">
    <header class="module-head">
        <h2 class="module-title">{name}</h2>
        <button type="button" class="icon-btn" data-action="refresh" aria-label="Odśwież">
            <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
    </header>
    <div class="card-msg" data-role="error" hidden></div>
    <div class="cards cards--nested">
        <article class="card" data-gpio="5" data-time="300" data-cycles="1" data-label="Linia 1"></article>
        <article class="card" data-gpio="4" data-time="80" data-cycles="4" data-label="Linia 2"></article>
        <article class="card" data-gpio="15" data-time="300" data-cycles="1" data-label="Linia 3"></article>
        <article class="card" data-gpio="14" data-time="300" data-cycles="1" data-label="Linia 4"></article>
    </div>
</section>
